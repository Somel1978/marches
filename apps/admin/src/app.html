<!doctype html>
<!-- apps/admin/src/app.html -->
<html lang="en" data-theme="admin">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Apply saved theme immediately before paint — reads cookie to avoid flash -->
		<script>
			(function(){
				var m = document.cookie.match(/(?:^|;\s*)adminTheme=([^;]+)/);
				if (m && m[1]) document.documentElement.setAttribute('data-theme', decodeURIComponent(m[1]));
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
